name: Build and Distribute

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v2

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks


      - uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.44.6'

      - uses: cedvdb/action-flutter-build-ios@v1
        with:
          build-cmd: flutter build ipa --release --obfuscate --split-debug-info=./symbols --export-options-plist=ExportOptions.plist
          certificate-base64: 









          certificate-password: 123
          provisioning-profile-base64: 






          keychain-password: 111111
      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/ios/ipa
      
      - name: Upload using iTMSTransporter
        env:
          WORKING_DIRECTORY: build/ios/ipa
          IPA_FILE_NAME: 拾岸微光.ipa
          APPLE_USERNAME: VictoriousJulio624@outlook.com
          APPLE_PASSWORD: akhr-fvjo-mqbn-gmjq
          APPLE_ASC_PROVIDER: 9STZLT47AN
        run: |
          cd $WORKING_DIRECTORY
          git clone https://github.com/ZhangLi1984/itsm.git
          ./itsm/bin/iTMSTransporter -assetFile $IPA_FILE_NAME -u $APPLE_USERNAME -p $APPLE_PASSWORD -m upload -asc_provider $APPLE_ASC_PROVIDER
